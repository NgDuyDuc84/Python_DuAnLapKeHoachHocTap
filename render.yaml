# Temporary report demo: Free web + Free PostgreSQL, no paid worker services.
services:
  - type: web
    name: nhip-hoc-demo
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    dockerCommand: python -m deploy.demo
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.render
      - key: DJANGO_DEBUG
        value: "false"
      - key: RENDER_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nhip-hoc-demo-db
          property: connectionString
      - key: TRUSTED_PROXY
        value: "*"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

databases:
  - name: nhip-hoc-demo-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: nhiphoc
    ipAllowList: []
