name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput
      - run: python manage.py makemigrations --check --dry-run
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nhiphoc
          POSTGRES_USER: nhiphoc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhiphoc -d nhiphoc"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://nhiphoc:ci-only-password@127.0.0.1:5432/nhiphoc?sslmode=disable
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-generated-example-secret-key-not-for-production-84
      DJANGO_ALLOWED_HOSTS: study.example.test,localhost,127.0.0.1
      SITE_URL: https://study.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput --settings=config.production
      - run: python manage.py check --deploy --fail-level WARNING --settings=config.production
      - run: python manage.py test --noinput
      - run: docker build --tag nhiphoc-test .
      - run: docker compose config --quiet
      - name: Start isolated local web and workers
        run: docker compose -p ci-smoke up --build --detach
      - name: Verify complete HTTP journey and reminder worker
        run: python -m deploy.smoke --allow-test-data --expect-reminders
      - name: Verify long-running services
        run: |
          docker compose -p ci-smoke ps --status running --services > running-services.txt
          python -c "from pathlib import Path; assert set(Path('running-services.txt').read_text().split()) == {'db', 'web', 'reminders', 'calendar'}"
      - name: Show local service logs on failure
        if: failure()
        run: docker compose -p ci-smoke logs --no-color --tail=120
      - name: Remove isolated CI services and data
        if: always()
        run: docker compose -p ci-smoke down --volumes --remove-orphans
