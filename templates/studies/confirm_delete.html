{% extends "studies/base.html" %}

{% block study_content %}
<div class="study-form-card">
    <h2>{{ object }}</h2>
    <p>{{ view.delete_warning }}</p>
    <p>Thao tác xóa không thể hoàn tác trong ứng dụng.</p>
    <form class="form-actions" method="post">
        {% csrf_token %}
        <button class="button button-danger" type="submit">Xác nhận xóa</button>
        <a class="text-link" href="{{ view.success_url }}">Hủy, giữ lại</a>
    </form>
</div>
{% endblock %}
