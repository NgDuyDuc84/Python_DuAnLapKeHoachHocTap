{% extends "studies/base.html" %}

{% block study_content %}
<div class="study-form-card">
    {% if request.resolver_match.url_name == 'task_progress' %}<h2>{{ view.object }}</h2>{% endif %}
    <form class="study-form" method="post">
        {% csrf_token %}
        {% include "studies/form_fields.html" %}
        <div class="form-actions">
            <button class="button" type="submit">Lưu thay đổi</button>
            <a class="text-link" href="{{ view.success_url }}">Hủy</a>
        </div>
    </form>
</div>
{% endblock %}
