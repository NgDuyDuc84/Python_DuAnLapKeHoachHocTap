{% extends "base.html" %}

{% block title %}Đã đổi mật khẩu — Nhịp Học{% endblock %}
{% block content %}
<section class="auth-shell" aria-labelledby="password-done-title">

        <a class="button" href="{% url 'accounts:profile' %}">Về tài khoản của bạn</a>
    </div>
</section>
{% endblock %}
