        <form class="account-form" method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            {% if form.non_field_errors %}
                <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
            {% endif %}
            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                    {% if field.help_text %}
                        <div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button class="button" type="submit">{{ submit_label }}</button>
        </form>
